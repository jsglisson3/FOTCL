    <path d="M335 86 Q339 92 337 100"/>
  </g>

  <!-- Green ribbon bookmark -->
  <path d="M151 222 H169 V266 L160 258 L151 266 Z" fill="#79a048"/>

  <!-- Pages -->
  <path d="M160 90 C120 70 64 70 30 82 L30 214 C64 202 120 204 160 224 Z" fill="#ffffff" stroke="#135897" stroke-width="6" stroke-linejoin="round"/>
  <path d="M160 90 C200 70 256 70 290 82 L290 214 C256 202 200 204 160 224 Z" fill="#ffffff" stroke="#135897" stroke-width="6" stroke-linejoin="round"/>

  <!-- A few lines of "text" on the pages -->
  <g stroke="#135897" stroke-width="4" stroke-linecap="round" opacity="0.16">
    <path d="M54 102 C82 95 112 95 138 104"/>
    <path d="M182 104 C208 95 238 95 266 102"/>
