<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="A smiling open book" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Floating hearts in the three logo colors -->
  <g class="hearts">
    <path d="M100 38c0-8 10-8 10 0 0-8 10-8 10 0 0 8-10 12-10 18 0-6-10-10-10-18z" fill="#79a048"/>
    <path d="M150 24c0-8 10-8 10 0 0-8 10-8 10 0 0 8-10 12-10 18 0-6-10-10-10-18z" fill="#135897"/>
    <path d="M200 38c0-8 10-8 10 0 0-8 10-8 10 0 0 8-10 12-10 18 0-6-10-10-10-18z" fill="#b32b39"/>
  </g>

  <!-- Soft shadow -->
  <ellipse cx="160" cy="244" rx="118" ry="9" fill="#135897" opacity="0.12"/>

  <!-- Red cover peeking out behind the pages -->
  <path d="M18 80 L18 226 C70 212 120 216 160 236 C200 216 250 212 302 226 L302 80 Z" fill="#b32b39"/>

  <!-- Pages -->
  <path d="M160 82 C120 62 64 62 30 74 L30 214 C64 202 120 204 160 224 Z" fill="#ffffff" stroke="#135897" stroke-width="6" stroke-linejoin="round"/>
  <path d="M160 82 C200 62 256 62 290 74 L290 214 C256 202 200 204 160 224 Z" fill="#ffffff" stroke="#135897" stroke-width="6" stroke-linejoin="round"/>

  <!-- A few lines of "text" on the pages -->
  <g stroke="#135897" stroke-width="4" stroke-linecap="round" opacity="0.18">
    <path d="M56 96 C82 90 112 90 136 98"/>
    <path d="M184 98 C208 90 238 90 264 96"/>
  </g>

  <!-- Face -->
  <circle cx="108" cy="134" r="10" fill="#1f2933"/>
  <circle cx="112" cy="130" r="3.5" fill="#ffffff"/>
  <circle cx="212" cy="134" r="10" fill="#1f2933"/>
  <circle cx="216" cy="130" r="3.5" fill="#ffffff"/>
  <ellipse cx="88" cy="162" rx="13" ry="7" fill="#b32b39" opacity="0.3"/>
  <ellipse cx="232" cy="162" rx="13" ry="7" fill="#b32b39" opacity="0.3"/>
  <path d="M126 164 Q160 198 194 164" fill="none" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
</svg>
