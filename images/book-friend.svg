<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 0 364 290" role="img" aria-label="A smiling open book waving hello" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Floating hearts in the three logo colors -->
