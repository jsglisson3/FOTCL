    <path d="M102 42c0-8 10-8 10 0 0-8 10-8 10 0 0 8-10 12-10 18 0-6-10-10-10-18z" fill="#79a048"/>
    <path d="M150 26c0-9 11-9 11 0 0-9 11-9 11 0 0 9-11 13-11 20 0-7-11-11-11-20z" fill="#135897"/>
    <path d="M198 42c0-8 10-8 10 0 0-8 10-8 10 0 0 8-10 12-10 18 0-6-10-10-10-18z" fill="#b32b39"/>
  </g>

  <!-- Soft shadow -->
  <ellipse cx="160" cy="276" rx="118" ry="9" fill="#135897" opacity="0.12"/>

  <!-- Red cover peeking out behind the pages -->
  <path d="M18 88 L18 226 C70 212 120 216 160 236 C200 216 250 212 302 226 L302 88 Z" fill="#b32b39"/>


