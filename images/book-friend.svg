    <path d="M198 121 Q212 113 226 122"/>
  </g>
  <circle cx="108" cy="142" r="11" fill="#1f2933"/>
  <circle cx="112" cy="137" r="4" fill="#ffffff"/>
  <circle cx="212" cy="142" r="11" fill="#1f2933"/>
  <circle cx="216" cy="137" r="4" fill="#ffffff"/>
  <ellipse cx="86" cy="168" rx="13" ry="7" fill="#b32b39" opacity="0.28"/>
  <ellipse cx="234" cy="168" rx="13" ry="7" fill="#b32b39" opacity="0.28"/>
  <path d="M136 163 Q160 200 184 163 Q160 172 136 163 Z" fill="#1f2933" stroke="#1f2933" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150 177 Q160 186 170 177 Q160 172 150 177 Z" fill="#e8777f"/>
