    <path d="M302 150 Q322 132 322 108"/>
  </g>
  <circle cx="0" cy="212" r="9" fill="#ffffff" stroke="#135897" stroke-width="4"/>
  <circle cx="322" cy="100" r="10" fill="#ffffff" stroke="#135897" stroke-width="4"/>
  <g fill="none" stroke="#79a048" stroke-width="3" stroke-linecap="round">
