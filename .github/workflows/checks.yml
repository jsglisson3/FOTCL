# Runs the site checks every time a change is pushed to GitHub.
# Results show on the repository's "Actions" tab. A green check means
# everything passed; a red X means something needs fixing (GitHub emails you).

name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the checking tools
        run: npm ci

      - name: Install a test browser
        run: npx playwright install --with-deps chromium

      - name: Check the HTML is valid
        run: npx html-validate "*.html"

      - name: Check links, JavaScript, phone layout and accessibility
        run: node tools/check-site.mjs